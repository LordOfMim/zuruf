name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: zuruf-*-x64
          path: artifacts
          merge-multiple: true
      - name: Validate tag and checksums
        run: python3 tools/release/verify-release.py "$GITHUB_REF_NAME"
      - name: Attest downloadable packages
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.tar.gz
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --draft --title "Zuruf $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
