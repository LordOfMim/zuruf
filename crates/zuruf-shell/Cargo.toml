[package]
name = "zuruf-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "Zuruf's own browser window: embedded Chromium with the app docked beside the page."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
cef = "156"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Chromium on macOS needs its own NSApplication subclass and a main menu for the edit commands.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
] }
