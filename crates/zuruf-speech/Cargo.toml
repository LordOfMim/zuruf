[package]
name = "zuruf-speech"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zuruf-platform = { path = "../zuruf-platform" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
