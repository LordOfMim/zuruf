<!doctype html><meta charset="utf-8"><title>Zuruf Browser-Spike</title>
<style>body{font:16px sans-serif;margin:20px} input,button,select,[contenteditable]{margin:8px;padding:8px} #tile{position:absolute;left:400px;top:350px;width:160px;height:100px;background:rgb(24,120,200)} #deep{margin-top:1400px} </style>
<h1>Lokale Prüffläche</h1><button data-testid="counter" aria-label="Zähler erhöhen" data-token="fixture-secret" onclick="this.dataset.count=String(Number(this.dataset.count||0)+1)">Zähler erhöhen</button>
<input id="text" aria-label="Text"><input id="password" type="password" value="fixture-password"><textarea id="area"></textarea><select id="select"><option>W</option><option>S</option></select><div contenteditable="true" id="editable">Editierbar: </div><div class="monaco-editor" tabindex="0">Editorfläche</div>
<div id="shadow"></div><iframe id="frame" src="/frame.html" title="Prüfframe"></iframe><div id="tile"></div><div id="deep"><button data-testid="deep">Unten</button></div>
<script>document.querySelector('#shadow').attachShadow({mode:'open'}).innerHTML='<input aria-label="Shadow"><button data-testid="shadow-button">Shadow-Aktion</button>'; window.addEventListener('keydown',e=>e.stopImmediatePropagation());</script><closed-input tabindex="0" style="display:inline-block;width:180px;height:40px"></closed-input>
<script>document.querySelector('closed-input').attachShadow({mode:'closed'}).innerHTML='<input aria-label="Geschlossene Eingabe">';</script>
